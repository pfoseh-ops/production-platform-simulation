apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "production-simulation.name" . }}
spec:
  minAvailable: 2
  selector:
    matchLabels:
      {{- include "production-simulation.selectorLabels" . | nindent 6 }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "production-simulation.name" . }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "production-simulation.name" . }}
  minReplicas: 3
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
