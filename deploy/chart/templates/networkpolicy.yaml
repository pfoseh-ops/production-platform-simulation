apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "production-simulation.name" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "production-simulation.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
