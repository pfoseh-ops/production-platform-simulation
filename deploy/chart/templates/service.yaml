apiVersion: v1
kind: Service
metadata:
  name: {{ include "production-simulation.name" . }}
  labels:
    {{- include "production-simulation.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "production-simulation.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
